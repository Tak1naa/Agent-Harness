<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>路径穿越证据回放</title><style>*{box-sizing:border-box}body{margin:0;background:#fafaf7;color:#191919;font-family:"WenQuanYi Zen Hei",sans-serif}main{width:1280px;height:720px;padding:42px 64px;position:relative}small{font-size:20px;color:#555}h1{font-size:38px;margin:16px 0}p{font-size:25px;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:22px/1.3 monospace;background:#eee;padding:20px;margin:20px 0;height:420px;overflow:hidden}footer{position:absolute;bottom:20px;left:64px;right:64px;display:flex;justify-content:space-between;font-size:17px}button{font:inherit;padding:5px 15px}#bar{height:4px;background:#333;position:absolute;bottom:0;left:0;width:0}</style><main><small id="label"></small><h1 id="title"></h1><p id="text"></p><pre id="code"></pre><footer><span>真实运行记录回放 · 20 秒 · 无模型调用</span><button id="start">播放 / 重新播放</button><span id="clock">00 / 20 秒</span></footer><div id="bar"></div></main><script>const frames=[{"title": "1  目标函数与参考输入", "label": "人工参考测试 · path-01", "text": "读取公共目录下文件，输入 ../secret.txt", "code": "def handle(value: str, root: str):\n    return open(os.path.join(root, value)).read()\n\n# 同一安全性质测试\ndef test_security(probe):\n    probe.check(\"../secret.txt\")"}, {"title": "2  缺陷版触发真实越界读", "label": "原始证据 · results/reference/path-01.json", "text": "返回目录外的随机哨兵内容，可信探针判定违规", "code": "{\n  \"status\": \"violation\",\n  \"uid\": 65532,\n  \"input\": \"../secret.txt\",\n  \"evidence\": {\n    \"private_content_returned\": true\n  }\n}"}, {"title": "3  修复版拒绝同一输入", "label": "配对证据 · 同一测试未改动", "text": "规范化路径并检查边界，违规不再出现", "code": "{\n  \"status\": \"pass\",\n  \"input\": \"../secret.txt\",\n  \"rejected\": true,\n  \"evidence\": {\n    \"private_content_returned\": false\n  }\n}"}, {"title": "4  服务器再次复现", "label": "服务器证据 · results/server/path.json", "text": "缺陷版 violation，修复版 pass；工程验收成立", "code": "{\n  \"buggy\": \"violation\",\n  \"fixed\": \"pass\",\n  \"rootless\": true,\n  \"image_id\": \"6c860382bc37d78483562a90152d5312d9f662c5382e126c2663ac94b51bd05b\"\n}\n\n这是人工参考测试的运行记录回放。\n真实模型 A/B/C 实验尚未运行。"}];let timer;function show(i){for(const k of ['title','label','text','code'])document.getElementById(k).textContent=frames[i][k]}show(0);window.play=function(){clearInterval(timer);let started=performance.now();if(location.hash==='#record')document.getElementById('start').style.visibility='hidden';timer=setInterval(()=>{let t=Math.min(20,(performance.now()-started)/1000);show(Math.min(3,Math.floor(t/5)));document.getElementById('clock').textContent=String(Math.floor(t)).padStart(2,'0')+' / 20 秒';document.getElementById('bar').style.width=(100*t/20)+'%';if(t>=20)clearInterval(timer)},50)};document.getElementById('start').onclick=play;</script></html>
