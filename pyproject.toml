[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bjtu-safety-harness"
version = "0.1.0"
description = "Reproducible analysis-guided Python security test generation"
requires-python = ">=3.11"
dependencies = [
  "bandit==1.8.6",
  "pytest==8.4.2",
  "hypothesis==6.140.3",
  "coverage==7.10.7",
  "requests==2.32.5",
  "python-dotenv==1.2.1",
  "mcp==1.12.4",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "starlette==0.47.3",
  "uvicorn==0.54.0",
]

[project.scripts]
safety-harness = "safety_harness.cli:main"
safety-harness-mcp = "safety_harness.mcp_server:main"
safety-harness-web = "safety_harness.web:main"

[tool.setuptools.package-data]
safety_harness = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]

[tool.setuptools.packages.find]
include = ["safety_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["container: requires a rootless Podman engine and built image"]
